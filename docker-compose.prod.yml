name: joblens

x-ai-common-env: &ai-common-env
  JOBLENS_ENV: production
  JOBLENS_INTERNAL_API_KEY: ${JOBLENS_INTERNAL_API_KEY:?Set JOBLENS_INTERNAL_API_KEY in .env}
  JOBLENS_ENABLE_PUBLIC_ROUTES: "false"
  JOBLENS_ENABLE_DOCS: "false"
  JOBLENS_FREE_MODELS_ONLY: "true"
  JOBLENS_PARSING_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
  JOBLENS_PARSING_FALLBACK_MODEL: openrouter/free
  JOBLENS_ATS_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
  JOBLENS_SCORING_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
  JOBLENS_OCR_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
  JOBLENS_SCRAPER_ENRICHMENT_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
  JOBLENS_INTERVIEW_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
  PORT: "8000"

services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  ai-integrity-service:
    build: ./ai-integrity-service
    env_file: ./ai-integrity-service/.env
    environment:
      <<: *ai-common-env
      AI_SQLSERVER_CONNECTION_STRING: Server=sql-server;Database=GPAi;UID=sa;PWD=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
    depends_on:
      sql-server:
        condition: service_healthy
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - torch_cache:/root/.cache/torch
      - integrity_outputs:/app/outputs
    restart: unless-stopped

  ai-recruitment-service:
    build: ./ai-recruitment-service
    env_file: ./ai-recruitment-service/.env
    environment:
      <<: *ai-common-env
      JOBLENS_CHROMA_PATH: /root/.cache/chroma
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - torch_cache:/root/.cache/torch
      - chroma_data:/root/.cache/chroma
    restart: unless-stopped

  ai-interview-service:
    build: ./ai-interview-service
    env_file: ./ai-interview-service/.env
    environment:
      <<: *ai-common-env
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - torch_cache:/root/.cache/torch
      - tts_cache:/root/.local/share/tts
    restart: unless-stopped

  ai-gateway:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ai-integrity-service
      - ai-interview-service
      - ai-recruitment-service
    restart: unless-stopped

  dotnet-gateway:
    build:
      context: ./backend-gateway-dotnet
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "5245"
      AIBackend__BaseUrl: http://ai-gateway:80
      AIBackend__ApiKey: ${JOBLENS_INTERNAL_API_KEY}
      ConnectionStrings__DefaultConnection: Server=sql-server;Database=GPDot;UID=sa;PWD=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Storage__RootPath: /app/data/storage
      Security__FrontendBaseUrl: https://${JOBLENS_DOMAIN:?Set JOBLENS_DOMAIN in .env}
      Security__SeedAdminEnabled: "true"
      Security__SeedAdminEmail: ${ADMIN_EMAIL:-admin@joblens.local}
      Security__SeedAdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      Demo__SeedEnabled: ${DEMO_SEED_ENABLED:-true}
      Demo__Password: ${DEMO_PASSWORD:-}
      Cors__Origins__0: https://${JOBLENS_DOMAIN}
    volumes:
      - dotnet_storage:/app/data/storage
    depends_on:
      sql-server:
        condition: service_healthy
      ai-gateway:
        condition: service_started
    restart: unless-stopped

  angular-frontend:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      JOBLENS_DOMAIN: ${JOBLENS_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dotnet-gateway
      - angular-frontend
    restart: unless-stopped

volumes:
  mssql_data:
  huggingface_cache:
  torch_cache:
  tts_cache:
  chroma_data:
  dotnet_storage:
  integrity_outputs:
  caddy_data:
  caddy_config:
